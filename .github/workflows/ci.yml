name: CI

# Typecheck + run the engine/db/mcp test suites on every push and PR.
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      # Node 24: the research DB uses the built-in `node:sqlite`.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Test (engine + db + mcp)
        run: pnpm -r test
